<!DOCTYPE html>
<html>
  <body>
    <h1>My Consolidated App</h1>
    <div id="app1-data">Loading data...</div>

    <script>
      fetch('YOUR_APPS_SCRIPT_URL_HERE')
        .then(response => response.json())
        .then(data => {
          // Display the title from your Apps Script JSON response
          document.getElementById('app1-data').innerText = data.title; 
        })
        .catch(error => {
          console.error('Error:', error);
        });
    </script>
  </body>
</html>
